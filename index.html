mk('c7','bar',{labels:b,datasets:[ds('Budget',D.portfolio.map(p=>p.sb),'#3b82f6'),ds('Digital',D.portfolio.map(p=>p.sd),'#f59e0b'),ds('On-Ground',D.portfolio.map(p=>p.sg),'#8b5cf6')]},{scales:{x:{stacked:true},y:{stacked:true}}})}
const card=(t,v,s,c)=>`<div class="rounded-2xl p-5 shadow-md text-white bg-gradient-to-br from-${c}-500 to-${c}-700"><div class="text-2xl font-extrabold">${v}</div><p class="text-xs font-bold mt-1 opacity-95">${t}</p><p class="text-[11px] opacity-80">${s}</p></div>`;
const box=(t,id)=>`<div class="bg-white rounded-2xl border shadow-sm p-4"><h4 class="text-sm font-bold mb-2">${t}</h4><div class="cw"><canvas id="${id}"></canvas></div></div>`;
function dash(){const p=D.portfolio,ta=p.reduce((a,x)=>a+x.ya,0),tt=p.reduce((a,x)=>a+x.yt,0),sp=p.reduce((a,x)=>a+x.tot,0);
return `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
${card('Portfolio YTD Achievement',pc(ta,tt)+'%',`Target ${n(tt)} | Actual ${n(ta)}`,'emerald')}
${card('Year Target Progress',pc(ta,p.reduce((a,x)=>a+x.target,0))+'%',`Of ${n(p.reduce((a,x)=>a+x.target,0))} units`,'sky')}
${card('Combined Approved Spend',n(sp)+' EGP',`of ${n(p.reduce((a,x)=>a+x.budget,0))} EGP budget`,'violet')}
${card('Pending Approvals',[...D.budget,...D.marketing,...D.onground,...D.campaigns].filter(r=>r.status===W).length,'Items awaiting approval','amber')}</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">${box('YTD Target vs Actual by Brand','c1')}${box('Approved Spend Share by Brand','c2')}${box('Spend by Channel Type','c3')}</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">${box('Monthly Sales: Target vs Actual','c4')}${box('Budget Utilization %','c5')}${box('Approval Pipeline Status','c6')}</div>
<div class="mb-6">${box('Approved Spend Breakdown per Brand (EGP)','c7')}</div>
<div class="bg-white rounded-2xl border shadow-sm p-5"><div class="flex justify-between mb-3"><h3 class="font-bold">Portfolio Master Table</h3><button onclick="addRow('portfolio')" class="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg">+ Brand Row</button></div>
<div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead><tr class="bg-slate-100 uppercase text-slate-600">${['Brand','Year Target','YTD Target','YTD Actual','YTD Ach','Year Ach','Allocated Budget','Budget Spend','Digital','On-Ground','Combined','Util %','Notes',''].map(h=>`<th class="p-3">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">
${p.map(r=>{const a=pc(r.ya,r.yt);return `<tr><td class="p-3 font-bold">${r.brand}</td><td class="p-3">${n(r.target)}</td><td class="p-3">${n(r.yt)}</td><td class="p-3 font-semibold text-emerald-700">${n(r.ya)}</td><td class="p-3"><span class="px-2 py-0.5 rounded-full font-bold ${a>=100?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}">${a}%</span></td><td class="p-3">${pc(r.ya,r.target)}%</td><td class="p-3">${n(r.budget)}</td><td class="p-3">${n(r.sb)}</td><td class="p-3">${n(r.sd)}</td><td class="p-3">${n(r.sg)}</td><td class="p-3 font-extrabold text-emerald-700">${n(r.tot)}</td><td class="p-3 font-bold">${pc(r.tot,r.budget)}%</td><td class="p-3 text-slate-500">${r.notes}</td><td class="p-3 whitespace-nowrap"><button onclick="edit('portfolio',${r.id})" class="mr-2">✏️</button><button onclick="del('portfolio',${r.id})" class="text-red-500">🗑</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function sheet(k){const t=T[k],hd=t.c.map(c=>c[0]).concat(t.st?['Status','Approver Notes'].concat(canA()?['Approval']:[]):[],['']);
return `<div class="bg-white rounded-2xl border shadow-sm p-5"><h3 class="font-bold mb-3">${t.h} Sheet</h3><div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead><tr class="bg-slate-100 uppercase text-slate-600">${hd.map(h=>`<th class="p-3">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">
${FS(k).map(r=>`<tr class="hover:bg-slate-50">${t.c.map(c=>`<td class="p-3">${c[1](r)}</td>`).join('')}${t.st?`<td class="p-3"><span class="cursor-pointer" onclick="hist('${k}',${r.id})" title="Status timeline">${badge(r.status)}</span></td><td class="p-3"><input value="${(r.notes||'').replace(/"/g,'&quot;')}" onchange="note('${k}',${r.id},this.value)" placeholder="Add notes..." class="w-48 text-xs p-1 border rounded"></td>${canA()?`<td class="p-3"><div class="flex gap-1"><button onclick="appr('${k}',${r.id},'Approved')" class="bg-violet-600 text-white px-2 py-1 rounded-lg">✔</button><button onclick="appr('${k}',${r.id},'Changes Requested')" class="bg-amber-500 text-white px-2 py-1 rounded-lg">💬</button><button onclick="appr('${k}',${r.id},'Rejected')" class="bg-red-600 text-white px-2 py-1 rounded-lg">✖</button></div></td>`:''}`:''}<td class="p-3 whitespace-nowrap"><button onclick="edit('${k}',${r.id})" class="mr-2">✏️</button><button onclick="dup('${k}',${r.id})" class="text-slate-500 px-1" title="Duplicate">⧉</button><button onclick="del('${k}',${r.id})" class="text-red-500">🗑</button></td></tr>`).join('')}</tbody></table></div></div>`}
function matrix(){const f=D.matrices[mb]||[];
return `<div class="bg-white rounded-2xl border shadow-sm p-5"><div class="flex flex-wrap gap-2 mb-4">${Object.keys(D.matrices).map(k=>`<button onclick="mb='${k}';render()" class="px-3 py-1.5 rounded-xl text-xs font-semibold border ${k===mb?'bg-slate-900 text-white':'bg-white text-slate-600'}">${k}</button>`).join('')}</div>
<div class="flex justify-between mb-3"><h3 class="font-bold">${mb}</h3><button onclick="addField()" class="bg-violet-600 text-white text-xs px-3 py-1.5 rounded-lg">+ Add Field</button></div>
<table class="w-full text-xs text-left"><thead><tr class="bg-slate-100 uppercase text-slate-600"><th class="p-3 w-1/3">Field</th><th class="p-3">Definition (click to edit)</th><th></th></tr></thead><tbody class="divide-y">
${f.map((x,i)=>`<tr><td class="p-3 font-bold">${x.field}</td><td class="p-3 ec" contenteditable="true" onblur="D.matrices[mb][${i}].def=this.textContent;persist()">${x.def}</td><td class="p-3"><button onclick="D.matrices[mb].splice(${i},1);render()" class="text-red-500">🗑</button></td></tr>`).join('')}</tbody></table></div>`}
function render(){calc();persist();$('pages').innerHTML=qa()+fbar()+(tab==='dashboard'?dash():tab==='overview'?ovw():tab==='tasks'?tasks():tab==='audit'?audit():tab==='report'?rpt():tab==='matrix'?matrix():sheet(tab));
$('nav').innerHTML=NAV.filter(x=>x[0]!=='audit'||(user&&user.role==='admin')).map(([k,l])=>`<button onclick="go('${k}')" class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-semibold ${k===tab?'bg-violet-600 text-white':'text-slate-300 hover:bg-slate-800'}">${l}</button>`).join('');
$('qb').innerHTML=D.portfolio.map(p=>`<button onclick="bf='${p.brand}';go('overview')" class="w-full text-left px-3 py-1.5 rounded-lg text-xs text-slate-400 hover:bg-slate-800 hover:text-emerald-400">${p.brand}</button>`).join('');
$('ttl').textContent=(NAV.find(x=>x[0]===tab)||[])[1].slice(3);if(tab==='dashboard')charts();if(tab==='overview')ocharts();bsw();bell();lock()}
function lock(){if(canW)return;document.querySelectorAll('.wr,#pages [onclick^="del("],#pages [onclick^="edit("],#pages [onclick^="appr("],#pages [onclick^="addRow"],#pages [onclick^="addField"],#pages [onclick^="addBrand"],#pages [onclick^="D.matrices"]').forEach(e=>e.style.display='none');document.querySelectorAll('#pages input').forEach(e=>e.disabled=true);document.querySelectorAll('#pages [contenteditable]').forEach(e=>e.contentEditable='false')}
function go(t){tab=t;render()}
function appr(k,id,s){if(!canA())return toast('You do not have approval rights');const r=D[k].find(x=>x.id===id);r.status=s;lg(r,s);if(s!=='Approved'){form('Reason / comments for '+s,[['note','Comments',r.notes||'']],v=>{r.notes=v.note;render()},()=>render())}else render()}
function note(k,id,v){D[k].find(x=>x.id===id).notes=v;persist()}
function del(k,id){form('Delete this item?',[],()=>{D[k]=D[k].filter(x=>x.id!==id);render()})}
function form(title,fields,ok,cancel){if(!canW)return toast('Read-only: Contributor access required');const f=$('df');f.innerHTML=`<h3 class="font-bold">${title}</h3>${fields.map(([k,l,d,num])=>k==='brand'?`<label class="block text-xs font-semibold">${l}<select name="brand" class="w-full border rounded-lg p-2 mt-1 text-sm">${(mine()?D.portfolio.filter(p=>mine().includes(p.brand)):D.portfolio).map(p=>`<option ${p.brand===d?'selected':''}>${p.brand}</option>`).join('')}</select></label>`:`<label class="block text-xs font-semibold">${l}<input name="${k}" value="${d}" ${num?'type="number"':''} class="w-full border rounded-lg p-2 mt-1 text-sm"></label>`).join('')}<div class="flex justify-end gap-2 pt-2"><button value="x" class="px-3 py-2 text-xs rounded-lg border">Cancel</button><button value="ok" class="px-4 py-2 text-xs rounded-lg bg-violet-600 text-white font-semibold">OK</button></div>`;
$('dlg').onclose=()=>{if($('dlg').returnValue==='ok'){const v={};new FormData(f).forEach((x,k)=>v[k]=x);ok(v)}else if(cancel)cancel();$('dlg').returnValue=''};$('dlg').showModal()}
function addRow(k){if(!k&&tab==='matrix')return addField();k=k||(T[tab]?tab:'assets');if(k==='portfolio')return addBrand();const t=T[k];form('Add to '+t.h,[['brand','Brand',bf||(mine()||[])[0]]].concat(t.add),v=>{const r={id:Date.now(),date:td(),notes:''};if(t.st){r.status=canA()?W:'Draft';lg(r,'Created')}t.add.forEach(([a,,,nm])=>r[a]=nm?+v[a]:v[a]);r.brand=v.brand;D[k].push(r);render()})}
function addBrand(){form('New Product / Brand',[['name','Name','']],v=>{const b=(v.name||'').trim();if(!b)return;if(!D.matrices[b])mx(b,'Active Formulation','-','-','-','-');if(!D.portfolio.some(p=>p.brand===b))D.portfolio.push({id:Date.now(),brand:b,target:0,yt:0,ya:0,budget:0,notes:'New Portfolio Product'});mb=b;tab='matrix';render()})}
function addField(){form('Add Field',[['field','Field',''],['def','Definition','']],v=>{if(v.field){D.matrices[mb].push({field:v.field,def:v.def});render()}})}

let user=null,token=null,canW=false,lastJ={},tm=null,busy={},poll=null,KEYS=['portfolio','assets','requests','guidelines','usage'];
const getV=k=>D[k],setSync=t=>{const e=$('sync');if(e)e.textContent=t};
function toast(m){setSync('⚠ '+m);setTimeout(()=>setSync(canW?'Live ✓':'Offline'),3500)}
async function api(path,o={}){const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}},o));if(r.status===401){logout();throw new Error('auth')}if(!r.ok)throw new Error('http '+r.status);return r.json()}
function persist(){if(!canW)return;clearTimeout(tm);tm=setTimeout(flush,500)}
async function flush(){for(const k of KEYS){const j=JSON.stringify(getV(k));if(lastJ[k]===j||busy[k])continue;busy[k]=1;try{const res=await api('/api/data',{method:'PUT',body:JSON.stringify({key:k,value:getV(k)})});if(res.value!==undefined){D[k]=res.value;lastJ[k]=JSON.stringify(res.value);render()}else lastJ[k]=j;setSync('Saved ✓')}catch(e){setSync('Save failed')}busy[k]=0}}
function editing(){const a=document.activeElement;return $('dlg').open||(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.isContentEditable))}
async function load(first){try{const res=await api('/api/data'),d=res.data||{};let ch=false;
for(const k of KEYS){if(d[k]!==undefined&&d[k]!==null){const j=JSON.stringify(d[k]);if(first||(JSON.stringify(getV(k))===lastJ[k]&&j!==lastJ[k])){D[k]=d[k];lastJ[k]=j;ch=true}}else if(first){lastJ[k]=undefined}}
setSync(canW?'Live ✓':'Read-only');if(ch&&(first||!editing()))render();if(first)persist()}catch(e){if(e.message!=='auth')setSync('Offline')}}
function refresh(){canW=!!user;if(user)$('ub').textContent=`${user.name} (${({admin:'Marketing Director/Manager',gpm:'Group Product Manager',pm:'Product Manager'})[user.role]||'Product Manager'})`;render()}
async function login(e){e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('le').value.trim(),password:$('lp').value})});if(!r.ok)throw 0;const j=await r.json();$('lerr').classList.add('hidden');enter(j.token,j.user)}catch(x){$('lerr').classList.remove('hidden')}b.disabled=false}
async function enter(t,u){token=t;user=u;try{localStorage.setItem('bal_s',JSON.stringify({t,u}))}catch(e){}$('lg').classList.add('hidden');$('app').classList.remove('hidden');canW=true;bf=(u.brands&&u.brands.length===1)?u.brands[0]:'';refresh();setSync('Loading…');$('pages').innerHTML=sk();await load(true);render();clearInterval(poll);poll=setInterval(()=>{if(!document.hidden)load(false)},8000)}
function logout(){try{localStorage.removeItem('bal_s')}catch(e){}clearInterval(poll);user=null;token=null;canW=false;$('app').classList.add('hidden');$('lg').classList.remove('hidden')}
const PF=[['target','Year Target Units',0,1],['yt','YTD Target',0,1],['ya','YTD Actual Units',0,1],['budget','Budget (EGP)',0,1],['notes','Notes','']];
function edit(k,id){const r=D[k].find(x=>x.id===id),fs=(k==='portfolio'?PF:[['brand','Brand',r.brand]].concat(T[k].add)).map(f=>f[0]==='brand'?f:[f[0],f[1],r[f[0]]??f[2],f[3]]);
form('Edit '+(r.brand||''),fs,v=>{fs.forEach(([a,,,nm])=>r[a]=nm?+v[a]:v[a]);if(r.status&&!canA()){r.status=window._fx===r.id?W:'Draft';lg(r,r.status===W?'Submitted':'Edited');window._fx=0};render()})}

const X={'Asset Library':['assets',[['Date','date'],['Brand','brand'],['Asset','name'],['Type','type'],['Version','version'],['Link','link'],['Expiry','expiry'],['Status','status'],['Notes','notes']]],'Asset Requests':['requests',[['Date','date'],['Brand','brand'],['Request','name'],['Priority','priority'],['Needed By','due'],['Details','details'],['Status','status'],['Notes','notes']]],'Brand Guidelines':['guidelines',[['Date','date'],['Brand','brand'],['Document','name'],['Version','version'],['Link','link'],['Status','status'],['Notes','notes']]],'Usage Log':['usage',[['Date','date'],['Brand','brand'],['Asset','name'],['Channel','channel'],['Used By','by']]]};
async function exportXlsx(){calc();const wb=XLSX.utils.book_new(),add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name.replace(/[:\\\/?*\[\]]/g,'-').slice(0,31));
Object.entries(X).forEach(([nm,[k,cols]])=>add(nm,[cols.map(c=>c[0])].concat(D[k].map(r=>cols.map(c=>typeof c[1]==='function'?c[1](r):(r[c[1]]??''))))));
XLSX.writeFile(wb,'Brand_Asset_Library_'+td()+'.xlsx')}
$('lgimg').src=document.querySelector('aside img').src;
try{const x=JSON.parse(localStorage.getItem('bal_s')||'null');if(x&&x.t)enter(x.t,x.u)}catch(e){}
</script></body></html>
