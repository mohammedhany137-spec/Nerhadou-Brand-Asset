mk('f1','bar',{labels:SP,datasets:[ds('EGP',SP.map(s=>Math.round(sm(C.filter(r=>r.spec===s),ac))),'#8b5cf6')]},{indexAxis:'y',plugins:{legend:{display:false}}});
mk('f2','doughnut',{labels:it.map(x=>x[0]),datasets:[{data:it.map(x=>sm(C,x[1])),backgroundColor:P}]});
mk('f3','bar',{labels:ms,datasets:[ds('EGP',ms.map(m=>Math.round(sm(C.filter(r=>r.date&&r.date.slice(0,7)===m),ac))),'#3b82f6')]},{plugins:{legend:{display:false}}});
mk('f4','bar',{labels:tp.map(x=>x[0]),datasets:[ds('EGP',tp.map(x=>Math.round(x[1])),'#10b981')]},{indexAxis:'y',plugins:{legend:{display:false}}})};
/* ---- Conference shares (split by specialty) ---- */
TV.shares=()=>{const a=isAd(),pl=PL();return `<div class="flex flex-wrap justify-between gap-2 mb-3"><div><h3 class="font-bold">Conference Shares by Specialty</h3><p class="text-xs text-slate-500">Every conference is split across the products of its specialty using these percentages (e.g. an IM conference is divided over the IM medicines). To change the split for future conferences just edit a % here, or add a product to a specialty. Only the Marketing Director/Manager can edit.</p></div>${a?`<button onclick="addSpec()" class="bg-violet-600 text-white text-xs font-semibold px-3 py-2 rounded-xl self-start">+ New specialty</button>`:''}</div><div class="grid grid-cols-1 xl:grid-cols-2 gap-4">${specs().map((s,i)=>{const R=SSF(s),cs=D.conferences.filter(r=>r.spec===s&&ok(r)),ct=sm(cs,'c26'),sum=Math.round(sm(R,'pct')*100)/100;return `<div class="bg-white rounded-2xl border shadow-sm p-4"><div class="flex justify-between items-start mb-2"><div><b>${ESC(s)}</b><div class="text-[11px] text-slate-500">${cs.length} conferences · ${n(Math.round(ct))} EGP</div></div><span class="text-[11px] font-bold px-2 py-1 rounded-full ${sum>100?'bg-red-100 text-red-700':sum===100?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${sum}% allocated${sum<100?' · '+Math.round((100-sum)*100)/100+'% free':''}</span></div><table class="w-full text-xs"><tbody class="divide-y">${R.map(x=>`<tr><td class="py-1.5">${ESC(x.prod)}${PT[x.prod]?` <span class="text-[10px] text-slate-400">${PT[x.prod]}</span>`:''}</td><td class="py-1.5 w-24"><input type="number" step="0.5" min="0" value="${x.pct}" ${a?'':'disabled'} onchange="ssSet(${x.id},this.value)" class="w-20 border rounded p-1 text-right"> %</td><td class="py-1.5 text-right text-slate-500">${n(Math.round(ct*x.pct/100))}</td><td class="py-1.5 w-6">${a?`<button onclick="ssDel(${x.id})" class="text-red-500">🗑</button>`:''}</td></tr>`).join('')||'<tr><td class="py-2 text-slate-500">No products yet.</td></tr>'}</tbody></table>${a?`<div class="flex gap-2 mt-2 pt-2 border-t"><select id="ssp${i}" class="flex-1 border rounded p-1 text-xs"><option value="">+ Add product…</option>${pl.filter(p=>!R.some(x=>x.prod===p)).map(p=>`<option>${ESC(p)}</option>`).join('')}</select><input id="ssv${i}" type="number" step="0.5" min="0" placeholder="%" class="w-16 border rounded p-1 text-xs"><button onclick="ssAdd(${i})" class="bg-violet-600 text-white text-xs px-2 rounded">Add</button></div>`:''}</div>`}).join('')}</div>`};
function ssSet(id,v){const r=D.specshare.find(x=>x.id===id);if(!isAd()||!r)return;r.pct=Math.max(0,+v||0);render()}
function ssDel(id){if(!isAd())return;D.specshare=D.specshare.filter(x=>x.id!==id);render()}
function ssAdd(i){if(!isAd())return;const s=specs()[i],p=$('ssp'+i).value,v=+$('ssv'+i).value;if(!p||!(v>0))return toast('Pick a product and enter a % above 0');const e=D.specshare.find(x=>x.spec===s&&x.prod===p);if(e)e.pct=v;else D.specshare.push({id:Date.now(),spec:s,prod:p,pct:v});render()}
function addSpec(){if(!isAd())return;form('New specialty',[['name','Specialty name','']],v=>{const s=(v.name||'').trim();if(!s||specs().includes(s))return toast('Name is empty or already exists');D.meta=Object.assign({},D.meta,{specs:(D.meta.specs||[]).concat(s)});render()})}
/* ---- Brand matrix: live conference allocation ---- */
function mxAlloc(){const b=mb;if(!b)return '';const per={};D.conferences.filter(ok).forEach(r=>alloc(r).forEach(x=>{if(x[0]===b){const o=per[r.spec]=per[r.spec]||{c:0,t:0,a:0};o.c++;o.t+=+r.c26||0;o.a+=x[1]}}));const sp=Object.keys(per).sort((x,y)=>per[y].a-per[x].a),pc=s=>(D.specshare.find(x=>x.spec===s&&x.prod===b)||{}).pct;
return `<h4 class="text-sm font-bold mt-5 mb-2">Conference allocation — ${ESC(b)} ${PT[b]?`<span class="text-xs font-normal text-slate-500">(${PT[b]})</span>`:''}</h4>`+(sp.length?tbl(['Specialty','Share','Conferences','Specialty cost','Allocated EGP'],sp.map(s=>[ESC(s),(pc(s)!=null?pc(s)+'%':'override'),per[s].c,n(Math.round(per[s].t)),`<b>${n(Math.round(per[s].a))}</b>`]).concat([['<b>Total</b>','',sm(sp,s=>per[s].c),'',`<b>${n(Math.round(sm(sp,s=>per[s].a)))}</b>`]])):'<p class="text-xs text-slate-500">This product has no conference shares yet. Add it to a specialty in Conference Shares.</p>')}
function matrix(){return matrix0()+mxAlloc()}
/* ---- Expenses dashboard ---- */
TV.d_exp=()=>{const Bg=F('budget').filter(ok),E=F('expenses').filter(ok),bt=sm(Bg,'amount'),sp=sm(E,'amount'),ov=Bg.filter(r=>spent(r)>r.amount).length,top=E.slice().sort((a,b)=>b.amount-a.amount).slice(0,10);
return kp([['Total Budget',n(bt),'EGP, '+Bg.length+' budget lines','sky'],['Spent',n(Math.round(sp)),pct(sp,bt)+'% of budget','amber'],['Remaining',n(Math.round(bt-sp)),'EGP','emerald'],['Over-budget Lines',ov,'categories above 100%',ov?'red':'violet']])+g2(box('Budget vs spent by category','e1'),box('Budget mix by category','e2'))+g2(box('Planned vs actual by quarter','e3'),box('Budget vs spent by brand','e4'))+g2(box('Spend by quarter and category','e5'),box('Events spend by specialty','e6'))+tbl(['Top expenses','Brand','Category','Qtr','Specialty','Total (EGP)'],top.map(r=>[ESC(r.name),ESC(r.brand),ESC(r.cat),r.q,ESC(r.spec||''),n(Math.round(r.amount))]))+alertBox('e')};
TC.d_exp=()=>{const Bg=F('budget').filter(ok),E=F('expenses').filter(ok),bb=uniq(Bg.map(r=>r.brand).concat(E.map(r=>r.brand))),ev=E.filter(r=>r.cat==='Events'&&r.spec),sp=uniq(ev.map(r=>r.spec.toLowerCase()));
mk('e1','bar',{labels:CAT,datasets:[ds('Budget',CAT.map(c=>sm(Bg.filter(r=>r.cat===c),'amount')),'#3b82f6'),ds('Spent',CAT.map(c=>Math.round(sm(E.filter(r=>r.cat===c),'amount'))),'#f59e0b')]});
mk('e2','doughnut',{labels:CAT,datasets:[{data:CAT.map(c=>sm(Bg.filter(r=>r.cat===c),'amount')),backgroundColor:P}]});
mk('e3','bar',{labels:QS,datasets:[ds('Planned',QS.map((q,i)=>sm(Bg,'q'+(i+1))),'#3b82f6'),ds('Actual',QS.map(q=>Math.round(sm(E.filter(r=>r.q===q),'amount'))),'#10b981')]});
mk('e4','bar',{labels:bb,datasets:[ds('Budget',bb.map(b=>sm(Bg.filter(r=>r.brand===b),'amount')),'#3b82f6'),ds('Spent',bb.map(b=>Math.round(sm(E.filter(r=>r.brand===b),'amount'))),'#f59e0b')]});
mk('e5','bar',{labels:QS,datasets:CAT.map((c,i)=>ds(c,QS.map(q=>Math.round(sm(E.filter(r=>r.cat===c&&r.q===q),'amount'))),P[i%P.length]))},{scales:{x:{stacked:true},y:{stacked:true}}});
mk('e6','bar',{labels:sp,datasets:[ds('EGP',sp.map(s=>Math.round(sm(ev.filter(r=>r.spec.toLowerCase()===s),'amount'))),'#8b5cf6')]},{plugins:{legend:{display:false}}})};
